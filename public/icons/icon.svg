<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background com gradiente -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="heart-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#fce7f3"/>
    </linearGradient>
  </defs>

  <!-- Fundo arredondado -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bg-gradient)"/>

  <!-- Coracao centralizado -->
  <g transform="translate(256, 270)">
    <path d="M0 -60 C-40 -100, -110 -80, -110 -20 C-110 40, 0 110, 0 110 C0 110, 110 40, 110 -20 C110 -80, 40 -100, 0 -60"
          fill="url(#heart-gradient)"
          transform="scale(1.2)"/>
  </g>

  <!-- Folha pequena (simbolizando nutricao) -->
  <g transform="translate(310, 160)">
    <ellipse cx="0" cy="0" rx="35" ry="50" fill="#22c55e" transform="rotate(-30)"/>
    <path d="M0 -50 Q5 0 0 50" stroke="#166534" stroke-width="4" fill="none"/>
  </g>
</svg>
